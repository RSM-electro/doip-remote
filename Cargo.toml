[workspace]
resolver = "2"
members = ["crates/doip-core", "crates/doip-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["doip-remote contributors"]

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }
