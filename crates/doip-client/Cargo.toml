[package]
name = "doip-client"
description = "Interactive command-line client for doip-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "doip-client"
path = "src/main.rs"

[dependencies]
doip-core = { path = "../doip-core" }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
ratatui = "0.26"
crossterm = "0.27"
colored = "3.1"
thiserror.workspace = true

# Driver installation is Windows-only; keep the download stack out of Linux builds.
[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

