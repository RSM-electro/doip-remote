[package]
name = "doip-client"
description = "Interactive command-line client for doip-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "doip-client"
path = "src/main.rs"

[dependencies]
doip-core = { path = "../doip-core" }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
inquire = "0.9"
colored = "3.1"
