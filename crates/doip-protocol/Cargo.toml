[package]
name = "doip-protocol"
description = "Relay handshake protocol shared by the DoIP client and server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
doip-core = { path = "../doip-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "rt"] }
